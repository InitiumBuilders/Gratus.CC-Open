<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Gratus page</title>
<meta name="description" content="Somebody's garden on Gratus.CC: what they are growing, and how long they have tended it.">
<meta name="theme-color" content="#050912">
<meta property="og:title" content="A Gratus page">
<meta property="og:description" content="What they are growing, and how long they have tended it.">
<meta property="og:image" content="https://www.gratus.cc/assets/brand/og/app.jpg">
<link rel="icon" href="/assets/brand/icon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css?v=36">
<link rel="stylesheet" href="/assets/css/page.css?v=2">
<style>
  .who { text-align: center; padding: 40px 0 8px; }
  .who .mark { width: 92px; height: 92px; }
  .who h1 { margin: 12px 0 4px; }
  .who .at { color: var(--violet-text); font-size: 17px; font-weight: 600; }
  .who .line { font-size: 19px; line-height: 29px; max-width: 34ch; margin: 14px auto 0; }
  .shape { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 26px 0; }
  .shape div { border: 1px solid var(--hair-2); border-radius: 20px; padding: 16px 8px;
    text-align: center; background: rgba(255,255,255,.02); }
  .shape b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px;
    line-height: 1; font-variant-numeric: lining-nums tabular-nums; color: #fff; }
  .shape span { font-size: 13px; color: var(--violet-text); }
  .faces { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 18px 0 8px; }
  .faces i { font-style: normal; font-size: 30px; line-height: 1; width: 52px; height: 52px;
    display: grid; place-items: center; border: 1px solid var(--hair-2); border-radius: 50%;
    background: rgba(255,255,255,.02); }
  .none { text-align: center; padding: 60px 0; }
</style>
</head>
<body class="doc">
<nav class="docnav"><a class="brand" href="/"><img src="/assets/art/gfx/logo.webp" alt=""><span>Gratus<em>.CC</em></span></a><a class="pill" href="/app">Grow your own</a></nav>
<main class="wrap" id="page"><p class="kick" style="text-align:center;padding:60px 0">Reading...</p></main>
<footer class="docfoot">
  <p class="tags">Grow With Gratus! Give And Grow Together!</p>
  <p class="presented">Gratus.CC presented by Outlier.Systems</p>
  <nav><a href="/the-story">The story</a> · <a href="/docs">Docs</a> · <a href="/app">The app</a></nav>
</footer>
<script type="module">
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const handle = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
const page = document.getElementById('page');
const N = (n) => String(n || 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
if (!handle) {
  page.innerHTML = '<div class="none"><h1>A Gratus page</h1><p>Every Gratus account has one. <a href="/app">Make yours</a>.</p></div>';
} else {
  document.title = '@' + handle + ' \u00b7 Gratus.CC';
  fetch('/api/account?handle=' + encodeURIComponent(handle)).then((r) => r.json()).then((d) => {
    if (!d.profile) {
      page.innerHTML = '<div class="none"><h1>Nothing here yet</h1><p>There is no public page at that handle. It may be private, or it may be free.</p><p><a href="/app">Grow your own garden</a></p></div>';
      return;
    }
    const p = d.profile, g = p.garden || {};
    page.innerHTML =
      '<div class="who"><img class="mark" src="/assets/art/gfx/logo.webp" alt="">' +
      '<h1>' + esc(p.name) + '</h1><p class="at">@' + esc(p.handle) + '</p>' +
      (p.line ? '<p class="line">' + esc(p.line) + '</p>' : '') +
      (p.since ? '<p class="kick" style="margin-top:14px">Growing since ' + esc(p.since) + '</p>' : '') + '</div>' +
      '<div class="shape"><div><b>' + N(g.plants) + '</b><span>Growing</span></div>' +
      '<div><b>' + N(g.days) + '</b><span>Days of care</span></div>' +
      '<div><b>' + N(g.ready) + '</b><span>Ready to give</span></div></div>' +
      ((g.faces || []).length ? '<div class="faces">' + g.faces.map((f) => '<i>' + esc(f) + '</i>').join('') + '</div>' : '') +
      '<p class="kick" style="text-align:center">The shape of a garden. Never a word of what is written in it.</p>' +
      '<p style="text-align:center;margin-top:30px"><a class="pill" href="/app" style="display:inline-flex">Grow your own</a></p>';
  }).catch(() => { page.innerHTML = '<div class="none"><h1>Could not read that page</h1><p><a href="/app">Open the app</a></p></div>'; });
}
</script>
</body>
</html>
